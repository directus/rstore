id: rstore-write-field-timestamps
language: TypeScript
severity: warning
message: '`fieldTimestamps` is now passed as `metadata: { fieldTimestamps }`'
rule:
  kind: pair
  has: { field: key, regex: '^fieldTimestamps$' }
  all:
    - has: { field: value, pattern: $V }
    - inside:
        kind: object
        inside:
          kind: arguments
          inside:
            kind: call_expression
            has: { field: function, regex: '(^|\.)(writeItem|applyMutation)$' }
fix: 'metadata: { fieldTimestamps: $V }'
